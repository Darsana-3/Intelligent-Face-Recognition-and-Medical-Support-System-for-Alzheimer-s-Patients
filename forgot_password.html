{% extends 'base_public.html' %}
{% block title %}Forgot Password - Alzheimer's Support{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i class="bi bi-key"></i></div>
            <h2>Forgot Password</h2>
            <p>Enter your username and we'll email a new temporary password to your registered email address.</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Account Type</label>
                    <div class="role-selector">
                        <input type="radio" name="role" id="role-admin" value="admin">
                        <label for="role-admin" data-role="admin"><i class="bi bi-shield-fill"></i>Admin</label>
                        <input type="radio" name="role" id="role-doctor" value="doctor">
                        <label for="role-doctor" data-role="doctor"><i class="bi bi-clipboard-pulse"></i>Doctor</label>
                        <input type="radio" name="role" id="role-patient" value="patient" checked>
                        <label for="role-patient" data-role="patient" class="active"><i class="bi bi-person-heart"></i>Patient</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" name="username" required autofocus>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2"><i class="bi bi-envelope-arrow-up"></i> Send New Password</button>
            </form>
        </div>
        <div class="auth-footer">
            <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
